<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-clinica" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Clínica Veterinaria</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="registroMascotas.html">Registro de mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Marcos</a></li>
                    <li class="nav-item"><a class="nav-link" href="cuidados.html">Cuidados</a></li>
                    <li class="nav-item"><a class="nav-link" href="informacionycontacto.html">Información y contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">

        <h1 class="h2 text-primary text-center mb-4">Registro de mascotas</h1>

        <form class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-success text-dark">Datos de la mascota y del propietario</div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre de la mascota</label>
                                <input type="text" id="nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="especie" class="form-label">Especie</label>
                                <select id="especie" class="form-select" required>
                                    <option value="" selected disabled>Seleccione una opción</option>
                                    <option>Perro</option>
                                    <option>Gato</option>
                                    <option>Conejo</option>
                                    <option>Otra</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="raza" class="form-label">Raza</label>
                                <input type="text" id="raza" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="nacimiento" class="form-label">Fecha de nacimiento</label>
                                <input type="date" id="nacimiento" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <span class="form-label d-block">Sexo</span>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="sexo" id="macho" required>
                                    <label class="form-check-label" for="macho">Macho</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="sexo" id="hembra">
                                    <label class="form-check-label" for="hembra">Hembra</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <label for="propietario" class="form-label">Nombre del propietario</label>
                                <input type="text" id="propietario" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" id="telefono" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="reset" class="btn btn-outline-primary">Limpiar</button>
                    <button type="submit" class="btn btn-primary">Registrar</button>
                </div>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
